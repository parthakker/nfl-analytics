<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <!-- field surface -->
  <rect x="100" y="70" width="600" height="310" fill="#3fd08b" fill-opacity="0.10"/>
  <rect x="40" y="70" width="60" height="310" fill="#3fd08b" fill-opacity="0.16"/>
  <rect x="700" y="70" width="60" height="310" fill="#3fd08b" fill-opacity="0.16"/>
  <!-- outer boundary -->
  <rect x="40" y="70" width="720" height="310" fill="none" stroke="#98a2b0" stroke-width="2"/>
  <!-- goal lines -->
  <line x1="100" y1="70" x2="100" y2="380" stroke="#98a2b0" stroke-width="2.5"/>
  <line x1="700" y1="70" x2="700" y2="380" stroke="#98a2b0" stroke-width="2.5"/>
  <!-- yard lines every 5 yards -->
  <g stroke="#98a2b0" stroke-width="1" opacity="0.75">
    <line x1="130" y1="70" x2="130" y2="380"/><line x1="160" y1="70" x2="160" y2="380"/>
    <line x1="190" y1="70" x2="190" y2="380"/><line x1="220" y1="70" x2="220" y2="380"/>
    <line x1="250" y1="70" x2="250" y2="380"/><line x1="280" y1="70" x2="280" y2="380"/>
    <line x1="310" y1="70" x2="310" y2="380"/><line x1="340" y1="70" x2="340" y2="380"/>
    <line x1="370" y1="70" x2="370" y2="380"/><line x1="430" y1="70" x2="430" y2="380"/>
    <line x1="460" y1="70" x2="460" y2="380"/><line x1="490" y1="70" x2="490" y2="380"/>
    <line x1="520" y1="70" x2="520" y2="380"/><line x1="550" y1="70" x2="550" y2="380"/>
    <line x1="580" y1="70" x2="580" y2="380"/><line x1="610" y1="70" x2="610" y2="380"/>
    <line x1="640" y1="70" x2="640" y2="380"/><line x1="670" y1="70" x2="670" y2="380"/>
  </g>
  <!-- midfield line -->
  <line x1="400" y1="70" x2="400" y2="380" stroke="#98a2b0" stroke-width="1.5"/>
  <!-- hash marks: one tick per yard, rendered as dashed thick lines -->
  <line x1="100" y1="207" x2="700" y2="207" stroke="#98a2b0" stroke-width="9" stroke-dasharray="1.5 4.5" opacity="0.55"/>
  <line x1="100" y1="243" x2="700" y2="243" stroke="#98a2b0" stroke-width="9" stroke-dasharray="1.5 4.5" opacity="0.55"/>
  <!-- yard numbers, bottom (facing viewer) -->
  <g fill="#e6edf3" font-size="14" text-anchor="middle">
    <text x="160" y="366">1 0</text><text x="220" y="366">2 0</text><text x="280" y="366">3 0</text>
    <text x="340" y="366">4 0</text><text x="400" y="366">5 0</text><text x="460" y="366">4 0</text>
    <text x="520" y="366">3 0</text><text x="580" y="366">2 0</text><text x="640" y="366">1 0</text>
  </g>
  <!-- yard numbers, top (rotated to face far sideline) -->
  <g fill="#e6edf3" font-size="14" text-anchor="middle">
    <text x="160" y="88" transform="rotate(180 160 84)">1 0</text>
    <text x="220" y="88" transform="rotate(180 220 84)">2 0</text>
    <text x="280" y="88" transform="rotate(180 280 84)">3 0</text>
    <text x="340" y="88" transform="rotate(180 340 84)">4 0</text>
    <text x="400" y="88" transform="rotate(180 400 84)">5 0</text>
    <text x="460" y="88" transform="rotate(180 460 84)">4 0</text>
    <text x="520" y="88" transform="rotate(180 520 84)">3 0</text>
    <text x="580" y="88" transform="rotate(180 580 84)">2 0</text>
    <text x="640" y="88" transform="rotate(180 640 84)">1 0</text>
  </g>
  <!-- end zone labels -->
  <text x="70" y="225" fill="#e6edf3" font-size="14" text-anchor="middle" transform="rotate(-90 70 225)" letter-spacing="4">END ZONE</text>
  <text x="730" y="225" fill="#e6edf3" font-size="14" text-anchor="middle" transform="rotate(90 730 225)" letter-spacing="4">END ZONE</text>
  <!-- goalposts on the end lines -->
  <g stroke="#4c8dff" stroke-width="2.5" fill="none">
    <path d="M 34 205 L 40 205 M 34 245 L 40 245 M 34 205 L 34 245"/>
    <path d="M 766 205 L 760 205 M 766 245 L 760 245 M 766 205 L 766 245"/>
  </g>
  <!-- dimension: 100 yards -->
  <g stroke="#4c8dff" stroke-width="1.5">
    <line x1="100" y1="48" x2="382" y2="48"/><line x1="418" y1="48" x2="700" y2="48"/>
    <line x1="100" y1="42" x2="100" y2="54"/><line x1="700" y1="42" x2="700" y2="54"/>
  </g>
  <text x="400" y="53" fill="#4c8dff" font-size="13" text-anchor="middle">100 yards</text>
  <!-- dimension: end zone -->
  <text x="70" y="62" fill="#e6edf3" font-size="12" text-anchor="middle">10 yds</text>
  <text x="730" y="62" fill="#e6edf3" font-size="12" text-anchor="middle">10 yds</text>
  <!-- dimension: width -->
  <g stroke="#4c8dff" stroke-width="1.5">
    <line x1="778" y1="70" x2="778" y2="195"/><line x1="778" y1="255" x2="778" y2="380"/>
    <line x1="772" y1="70" x2="784" y2="70"/><line x1="772" y1="380" x2="784" y2="380"/>
  </g>
  <text x="779" y="229" fill="#4c8dff" font-size="12" text-anchor="middle" transform="rotate(-90 779 225)">53 1/3 yds</text>
  <!-- hash mark callout -->
  <line x1="400" y1="243" x2="330" y2="412" stroke="#4c8dff" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="330" y="428" fill="#e6edf3" font-size="12" text-anchor="middle">hash marks — 70' 9" from each sideline, 18' 6" apart (same width as the uprights)</text>
</svg>

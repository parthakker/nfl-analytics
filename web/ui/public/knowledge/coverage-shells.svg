<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <!-- ================= Cover 1 (top-left) ================= -->
  <text x="200" y="52" fill="#cbd5e1" font-size="14" font-weight="600" text-anchor="middle">Cover 1 — one deep, man under</text>
  <rect x="30" y="64" width="340" height="142" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.35"/>
  <line x1="30" y1="206" x2="370" y2="206" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- single deep zone -->
  <rect x="36" y="70" width="328" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <circle cx="200" cy="100" r="8" fill="#22d3ee"/>
  <text x="200" y="123" fill="#cbd5e1" font-size="11" text-anchor="middle">FS</text>
  <!-- man defenders underneath -->
  <circle cx="70" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="135" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="200" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="265" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="330" cy="182" r="6" fill="#94a3b8"/>
  <text x="200" y="162" fill="#cbd5e1" fill-opacity="0.55" font-size="10" text-anchor="middle">man-to-man everywhere else</text>

  <!-- ================= Cover 2 (top-right) ================= -->
  <text x="600" y="52" fill="#cbd5e1" font-size="14" font-weight="600" text-anchor="middle">Cover 2 — two deep halves, five under</text>
  <rect x="430" y="64" width="340" height="142" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.35"/>
  <line x1="430" y1="206" x2="770" y2="206" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- two deep halves -->
  <rect x="436" y="70" width="161" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <rect x="603" y="70" width="161" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <circle cx="516" cy="100" r="8" fill="#22d3ee"/>
  <circle cx="684" cy="100" r="8" fill="#22d3ee"/>
  <text x="516" y="123" fill="#cbd5e1" font-size="11" text-anchor="middle">S</text>
  <text x="684" y="123" fill="#cbd5e1" font-size="11" text-anchor="middle">S</text>
  <!-- hole between safeties -->
  <text x="600" y="106" fill="#f472b6" fill-opacity="0.8" font-size="10" text-anchor="middle">hole</text>
  <!-- five zone droppers -->
  <circle cx="470" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="535" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="600" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="665" cy="182" r="6" fill="#94a3b8"/>
  <circle cx="730" cy="182" r="6" fill="#94a3b8"/>
  <text x="600" y="162" fill="#cbd5e1" fill-opacity="0.55" font-size="10" text-anchor="middle">corners squat in the flats</text>

  <!-- ================= Cover 3 (bottom-left) ================= -->
  <text x="200" y="264" fill="#cbd5e1" font-size="14" font-weight="600" text-anchor="middle">Cover 3 — three deep thirds, four under</text>
  <rect x="30" y="276" width="340" height="142" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.35"/>
  <line x1="30" y1="418" x2="370" y2="418" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- three deep thirds -->
  <rect x="36" y="282" width="105" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <rect x="147" y="282" width="105" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <rect x="258" y="282" width="106" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <circle cx="88" cy="312" r="8" fill="#22d3ee"/>
  <circle cx="200" cy="312" r="8" fill="#22d3ee"/>
  <circle cx="312" cy="312" r="8" fill="#22d3ee"/>
  <text x="88" y="335" fill="#cbd5e1" font-size="11" text-anchor="middle">CB</text>
  <text x="200" y="335" fill="#cbd5e1" font-size="11" text-anchor="middle">FS</text>
  <text x="312" y="335" fill="#cbd5e1" font-size="11" text-anchor="middle">CB</text>
  <!-- four underneath -->
  <circle cx="90" cy="394" r="6" fill="#94a3b8"/>
  <circle cx="163" cy="394" r="6" fill="#94a3b8"/>
  <circle cx="237" cy="394" r="6" fill="#94a3b8"/>
  <circle cx="310" cy="394" r="6" fill="#94a3b8"/>
  <text x="200" y="374" fill="#cbd5e1" fill-opacity="0.55" font-size="10" text-anchor="middle">eighth defender drops into the box</text>

  <!-- ================= Cover 4 (bottom-right) ================= -->
  <text x="600" y="264" fill="#cbd5e1" font-size="14" font-weight="600" text-anchor="middle">Cover 4 — quarters, three under</text>
  <rect x="430" y="276" width="340" height="142" rx="8" fill="#22c55e" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.35"/>
  <line x1="430" y1="418" x2="770" y2="418" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- four deep quarters -->
  <rect x="436" y="282" width="78" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <rect x="520" y="282" width="78" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <rect x="604" y="282" width="78" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <rect x="688" y="282" width="76" height="66" rx="6" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <circle cx="475" cy="312" r="8" fill="#22d3ee"/>
  <circle cx="559" cy="312" r="8" fill="#22d3ee"/>
  <circle cx="643" cy="312" r="8" fill="#22d3ee"/>
  <circle cx="726" cy="312" r="8" fill="#22d3ee"/>
  <text x="475" y="335" fill="#cbd5e1" font-size="11" text-anchor="middle">CB</text>
  <text x="559" y="335" fill="#cbd5e1" font-size="11" text-anchor="middle">S</text>
  <text x="643" y="335" fill="#cbd5e1" font-size="11" text-anchor="middle">S</text>
  <text x="726" y="335" fill="#cbd5e1" font-size="11" text-anchor="middle">CB</text>
  <!-- three underneath -->
  <circle cx="520" cy="394" r="6" fill="#94a3b8"/>
  <circle cx="600" cy="394" r="6" fill="#94a3b8"/>
  <circle cx="680" cy="394" r="6" fill="#94a3b8"/>
  <text x="600" y="374" fill="#cbd5e1" fill-opacity="0.55" font-size="10" text-anchor="middle">safeties read #2 — match rules</text>

  <!-- shared caption -->
  <text x="400" y="444" fill="#cbd5e1" fill-opacity="0.6" font-size="12" text-anchor="middle">Shaded areas = deep zone responsibilities · gray dots = underneath defenders</text>
</svg>

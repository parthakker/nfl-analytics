<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <!-- subtle field surface -->
  <rect x="30" y="60" width="740" height="360" fill="#3fd08b" fill-opacity="0.08" rx="8"/>
  <!-- title -->
  <text x="400" y="34" fill="#e6edf3" font-size="16" text-anchor="middle" font-weight="600">11 Personnel — 1 RB, 1 TE, 3 WR (shotgun)</text>
  <!-- defense side hint -->
  <text x="400" y="105" fill="#98a2b0" font-size="12" text-anchor="middle" opacity="0.7" letter-spacing="3">DEFENSE THIS WAY</text>
  <!-- line of scrimmage -->
  <line x1="40" y1="150" x2="760" y2="150" stroke="#4c8dff" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="752" y="140" fill="#4c8dff" font-size="12" text-anchor="end">line of scrimmage</text>

  <!-- offensive line (on the LOS) -->
  <g stroke="#98a2b0" stroke-width="2" fill="none">
    <circle cx="316" cy="180" r="16"/>
    <circle cx="358" cy="180" r="16"/>
    <circle cx="400" cy="180" r="16"/>
    <circle cx="442" cy="180" r="16"/>
    <circle cx="484" cy="180" r="16"/>
  </g>
  <g fill="#e6edf3" font-size="12" text-anchor="middle">
    <text x="316" y="185">LT</text><text x="358" y="185">LG</text><text x="400" y="185">C</text>
    <text x="442" y="185">RG</text><text x="484" y="185">RT</text>
  </g>

  <!-- TE (Y), inline, on the LOS -->
  <circle cx="530" cy="180" r="16" stroke="#4c8dff" stroke-width="2" fill="none"/>
  <text x="530" y="185" fill="#e6edf3" font-size="12" text-anchor="middle">Y</text>
  <text x="588" y="215" fill="#98a2b0" font-size="12" text-anchor="middle">TE — inline, on the line</text>

  <!-- X receiver: wide left, ON the line -->
  <circle cx="95" cy="180" r="16" stroke="#4c8dff" stroke-width="2" fill="none"/>
  <text x="95" y="185" fill="#e6edf3" font-size="12" text-anchor="middle">X</text>
  <text x="95" y="218" fill="#98a2b0" font-size="12" text-anchor="middle">split end — on the line,</text>
  <text x="95" y="233" fill="#98a2b0" font-size="12" text-anchor="middle">faces press alone</text>

  <!-- Slot: inside left, OFF the line -->
  <circle cx="195" cy="215" r="16" stroke="#4c8dff" stroke-width="2" fill="none"/>
  <text x="195" y="220" fill="#e6edf3" font-size="12" text-anchor="middle">S</text>
  <text x="195" y="253" fill="#98a2b0" font-size="12" text-anchor="middle">slot — off the ball,</text>
  <text x="195" y="268" fill="#98a2b0" font-size="12" text-anchor="middle">inside leverage</text>

  <!-- Z receiver: wide right, OFF the line -->
  <circle cx="705" cy="215" r="16" stroke="#4c8dff" stroke-width="2" fill="none"/>
  <text x="705" y="220" fill="#e6edf3" font-size="12" text-anchor="middle">Z</text>
  <text x="705" y="253" fill="#98a2b0" font-size="12" text-anchor="middle">flanker — off the line,</text>
  <text x="705" y="268" fill="#98a2b0" font-size="12" text-anchor="middle">can motion</text>

  <!-- QB shotgun -->
  <circle cx="400" cy="300" r="16" stroke="#4c8dff" stroke-width="2.5" fill="none"/>
  <text x="400" y="305" fill="#e6edf3" font-size="12" text-anchor="middle">QB</text>
  <text x="400" y="338" fill="#98a2b0" font-size="12" text-anchor="middle">shotgun, 4–5 yds deep</text>

  <!-- RB offset beside QB -->
  <circle cx="330" cy="300" r="16" stroke="#4c8dff" stroke-width="2" fill="none"/>
  <text x="330" y="305" fill="#e6edf3" font-size="12" text-anchor="middle">RB</text>
  <text x="300" y="338" fill="#98a2b0" font-size="12" text-anchor="middle">offset weak</text>

  <!-- on/off the line markers -->
  <g stroke="#4c8dff" stroke-width="1" stroke-dasharray="2 3" opacity="0.6">
    <line x1="95" y1="164" x2="95" y2="152"/>
    <line x1="530" y1="164" x2="530" y2="152"/>
  </g>

  <!-- eligibility note -->
  <text x="400" y="395" fill="#e6edf3" font-size="13" text-anchor="middle">7 players on the line (X, the 5 OL, and Y); the ends of the line plus the 4 off-the-line players are eligible</text>
  <text x="400" y="415" fill="#98a2b0" font-size="12" text-anchor="middle">Cyan = eligible skill players. Gray = interior OL (ineligible).</text>
</svg>

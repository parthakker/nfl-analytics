name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest tests/unit -q

  warehouse-fixture:
    runs-on: ubuntu-latest
    env:
      NFL_TEST_USE_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -m "warehouse or api" -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      # No npm pin. The lockfile is complete and validates under both npm 10
      # and npm 11 — the earlier pin was chasing the wrong cause. The real bug
      # was that `npm install` on Windows writes an incomplete wasm32-wasi
      # subtree; `npm run lint` now runs scripts/check_lock.mjs, which catches
      # that on the dev machine instead of here.
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # runs tsc -b first

  # Builds the UI, serves it from uvicorn against the fixture DBs, runs the
  # full e2e suite. Playwright's webServer spawns `python -m uvicorn`, so the
  # uv venv must be first on PATH.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NFL_TEST_USE_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/ui/package-lock.json }
      - run: uv sync
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: cd web/ui && npm ci && npm run build
      - run: cd web/ui && npx playwright install --with-deps chromium
      - run: cd web/ui && npm run e2e
